steps:
  - name: 'gcr.io/cloud-builders/yarn'
    args: ['install']
  - name: 'gcr.io/cloud-builders/yarn'
    args: ['select:$_BRAND']
  - name: 'gcr.io/cloud-builders/yarn'
    args: ['build']
    env: ['REACT_APP_API_URL=$_API_URL']
  - name: 'eu.gcr.io/brunoni-allmarine/firebase-tools'
    args: ['use', '$_BRAND', '--debug']
  - name: 'eu.gcr.io/brunoni-allmarine/firebase-tools'
    args: ['deploy', '--only', 'hosting:$BRANCH_NAME', '--debug']
