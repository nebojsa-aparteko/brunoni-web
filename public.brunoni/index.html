<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>MyBrunoni</title>

    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700&display=swap" rel="stylesheet">

    <style>
      @media print {
        nav {
          display: none;
        }

        @page {
          margin: 0 1cm 1cm;
        }


        body {
          margin: 1cm;
        }
      }

      html, body {
        height: 100%;
        -webkit-text-size-adjust: none;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height:100vh;
      }

      @keyframes wave {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-15px);
        }
      }

      .loader {
        width: 64px;
        height: 72px;
        overflow: hidden;
        position: relative;
        margin: calc(50vh - 32px) auto 0;
        display: none;
      }

      .loader-static {
        background: transparent url(cargo-ship.svg) center no-repeat;
        width: 64px;
        height: 64px;
        position: absolute;
        left: 0;
        top: 0;
      }

      .loader-animated {
        background: transparent url(cargo-ship-wave.svg) center no-repeat;
        width: 87px;
        height: 64px;
        animation: wave 1s infinite linear;
        position: absolute;
        left: 0;
        top: 0;
        z-index: 1;
      }

      .loader-text {
        font-weight: bold;
        font-size: .75em;
        font-family: sans-serif;
        position: absolute;
        top: 56px;
        color: #2C3C50;
        text-align: center;
        left: 0;
        right: 0;
      }

      @media print {
        body {
          margin: 0;
          padding: 0 !important;
          min-width: 768px;
        }
      }

      .page {
        display: table;
        width: 100%;
        height: 100%;
        font-family: 'Montserrat', sans-serif;
      }

      .content {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
      }

      .inside-content {
        width: 600px;
        margin: 0 auto;
      }

      .lead {
        margin-top: 2em;
        font-size: 1.5em;
      }

      .browser-list {
        list-style: none;
        padding-left: 0;
        margin-top: 1em;
      }

      .browser-list li {
        display: inline-block;
      }

      .browser-list li img {
        width: 48px;
      }

      .browser-list li + li {
        margin-left: 1em;
      }

      .logo {
        width: 120px;
      }

      .hidden {
        display: none;
      }
    </style>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          if (document.getElementById('rootspinner') !== null) {
            document.getElementById('rootspinner').style.display = 'block';
          }
        }, 1000);
      });
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="unsupportedBrowser" class="page hidden">
      <div class="content">
        <div class="inside-content">
          <img class="logo" src="./images/%REACT_APP_BRAND%/logo.png" />
          <p class="lead">You are using Internet Explorer browser which cannot support Ospitek View application. Please download a newer browser to be able to use this app.</P>
          <p>Here are some supported browsers</p>
          <ul class="browser-list">
            <li><a href="https://www.google.com/chrome/"><img src="./images/chrome_logo.svg" alt="Chrome browser logo"/></a></li>
            <li><a href="https://www.mozilla.org/en-US/firefox/new/"><img src="./images/firefox_logo.png" alt="Firefox browser logo"/></a></li>
            <li><a href="https://www.opera.com/"><img src="./images/opera_logo.svg" alt="Opera browser logo"/></a></li>
          </ul>
        </div>
      </div>
    </div>

    <div id="root">
      <div id="rootspinner" class="loader">
        <div class="loader-static"></div>
        <div class="loader-animated"></div>
        <div class="loader-text">Loading…</div>
      </div>
    </div>

    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

    <script>
      (function msieversion() {

        var ua = window.navigator.userAgent;
        var msie = ua.indexOf("MSIE ");

        var unsupportedBrowser = document.querySelector('#unsupportedBrowser');
        var regularContent = document.querySelector('#root');

        console.log(navigator.userAgent);

        if (msie > 0 || !!navigator.userAgent.match(/Trident.*rv\:11\./))  // If Internet Explorer, return version number
        {
          if (regularContent.parentNode) {
            regularContent.parentNode.removeChild(regularContent);
          }

          unsupportedBrowser.className = 'page';
        }
        return false;
      })();
    </script>

  </body>
</html>
